version: 2.1

setup: true

orbs:
  slack: circleci/slack@5.2.3
  kubernetes: circleci/kubernetes@1.3.1
  continuation: circleci/continuation@1.1.0

executors:
  # Used by build_docker_images and publish_docker_images
  docker_builder:
    docker:
      - image: cimg/base:stable-20.04
    working_directory: ~/openaev

  # Used by test
  python_test:
    docker:
      - image: cimg/python:3.14
    working_directory: ~/openaev

  # Used by ensure_formatting
  python_check:
    docker:
      - image: cimg/python:3.14
    working_directory: ~/repo

  # Used by linter
  flake8_check:
    docker:
      - image: alpine/flake8
    working_directory: ~/repo

  # Used by setup, deploy_testing and notifications
  base_runner:
    docker:
      - image: cimg/base:stable

commands:
  # Generate circleci config:
  generate_circleci_config:
    steps:
      - run:
          name: Generate CircleCI configuration
          working_directory: ~/openaev
          command: |
            set -e

            GENERATED_CONFIG="/tmp/generated_config.yml"

            # Collectors excluded completely from the workflow.
            # Example: "collectorname|othercollectorname"
            EXCLUDED_COLLECTORS=""

            # Collectors that are tested and built, but not published.
            # Example: "collectorname|othercollectorname"
            EXCLUDED_FOR_PUBLISH="template"

            echo "Generating CircleCI configuration..."

            # Discover collectors with pyproject.toml
            collectors=$(
              find . \
                -mindepth 2 \
                -maxdepth 2 \
                -name pyproject.toml \
                -print \
                | sed 's|^\./||' \
                | sed 's|/pyproject.toml$||' \
                | sort \
                | grep -Ev "^(${EXCLUDED_COLLECTORS})$" || true
            )

            published_collectors=$(
              echo "${collectors}" |
                grep -Ev "^(${EXCLUDED_FOR_PUBLISH})$" || true
            )

            if [ -z "${published_collectors}" ]; then
              echo "No publishable collectors found"
              exit 1
            fi

            echo "Collectors found:"
            if [ -n "${collectors}" ]; then
              echo "${collectors}"
            else
              echo "No collectors found"
              exit 1
            fi

            # Copy the current configuration without setup mode
            # and without the static workflow.
            sed \
              -e '/^setup: true$/d' \
              -e '/^workflows:$/,$d' \
              .circleci/config.yml > "${GENERATED_CONFIG}"

            echo "Generating workflow..."

            # Static workflow jobs.
            echo "workflows:
              openaev:
                jobs:
                  - ensure_formatting:
                      filters:
                        tags:
                          only: /^[0-9]+\.[0-9]+\.[0-9]+$/

                  - linter:
                      filters:
                        tags:
                          only: /^[0-9]+\.[0-9]+\.[0-9]+$/" \
              >> "${GENERATED_CONFIG}"

            # Generate test, build and publish jobs for every collector.
            for collector_name in ${collectors}; do

              echo "
                  - test:
                      name: test-${collector_name}
                      collector_name: ${collector_name}
                      filters:
                        tags:
                          only: /^[0-9]+\.[0-9]+\.[0-9]+$/

                  - build_docker_images:
                      name: build-${collector_name}
                      collector_name: ${collector_name}
                      requires:
                        - ensure_formatting
                        - linter
                        - test-${collector_name}
                      filters:
                        tags:
                          only: /^[0-9]+\.[0-9]+\.[0-9]+$/
              " >> "${GENERATED_CONFIG}"
            done

            for collector_name in ${published_collectors}; do
              echo "
                  - publish_docker_images:
                      name: publish-${collector_name}
                      collector_name: ${collector_name}
                      requires:
                        - build-${collector_name}
                      filters:
                        tags:
                          only: /^[0-9]+\.[0-9]+\.[0-9]+$/
                        branches:
                          only:
                            - main
              " >> "${GENERATED_CONFIG}"
            done

            # Deploy testing after all collectors have been published.
            echo "
                  - deploy_testing:
                      requires:
            " >> "${GENERATED_CONFIG}"

            for collector_name in ${published_collectors}; do
              echo "                      - publish-${collector_name}" \
                >> "${GENERATED_CONFIG}"
            done

            echo "
                      filters:
                        branches:
                          only:
                            - main

                  - notify_rolling:
                      requires:
                        - deploy_testing

                  - notify:
                      requires:
            " >> "${GENERATED_CONFIG}"

            # Notify after all collectors have been published.
            for collector_name in ${published_collectors}; do
              echo "                      - publish-${collector_name}" \
                >> "${GENERATED_CONFIG}"
            done

            echo "
                      filters:
                        tags:
                          only: /^[0-9]+\.[0-9]+\.[0-9]+$/
                        branches:
                          ignore: /.*/
            " >> "${GENERATED_CONFIG}"

            echo ""
            echo "Generated CircleCI configuration:"
            cat "${GENERATED_CONFIG}"

  # Initial commands
  install_alpine_dependencies:
    steps:
      - run:
          name: Install Alpine dependencies
          command: |
            apk --no-cache add curl gettext bash

  install_poetry:
    steps:
      - run:
          name: Install Poetry
          command: |
            pip install poetry==2.3.2
            poetry config installer.re-resolve false

  notify_slack_success:
    steps:
      - slack/notify:
          event: pass
          template: basic_success_1

  notify_slack_failure:
    steps:
      - slack/notify:
          event: fail
          template: basic_fail_1

  # Tests commands
  check_collector:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Check collector structure
          working_directory: ~/openaev/<< parameters.collector_name >>
          command: |
            echo "Checking collector: << parameters.collector_name >>"
            if [ ! -f pyproject.toml ]; then
              echo "ERROR: pyproject.toml not found"
              exit 1
            fi

            if [ ! -f Dockerfile ]; then
              echo "ERROR: Dockerfile not found"
              exit 1
            fi

            if [ ! -f Dockerfile_ubi9 ]; then
              echo "ERROR: Dockerfile_ubi9 not found"
              exit 1
            fi
            echo "Collector structure is valid."

  check_collector_tests:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Check collector tests
          working_directory: ~/openaev/<< parameters.collector_name >>
          command: |
            if [ -d tests ]; then
              echo "Tests directory found"
              echo "HAS_TESTS=true" >> "${BASH_ENV}"
            else
              echo "WARNING: tests directory not found for << parameters.collector_name >>"
              echo "HAS_TESTS=false" >> "${BASH_ENV}"
            fi

  install_collector_test_dependencies:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Install collector test dependencies
          working_directory: ~/openaev/<< parameters.collector_name >>
          command: |
            if [ "${HAS_TESTS}" = "true" ]; then
              poetry install --with test
            else
              echo "No tests found, skipping test dependencies installation"
            fi

  run_collector_tests:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Run collector tests
          working_directory: ~/openaev/<< parameters.collector_name >>
          command: |
            if [ "${HAS_TESTS}" = "true" ]; then
              echo "Running tests for << parameters.collector_name >>"
              poetry run pytest
            else
              echo "No tests found, skipping tests"
            fi

  # Docker commands
  build_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Build collector images
          working_directory: ~/openaev/<< parameters.collector_name >>
          command: |
            EXTRA=""

            if [ "${CIRCLE_BRANCH}" = "main" ]; then
              EXTRA="--build-arg PYOAEV_GIT_BRANCH_OVERRIDE=${CIRCLE_BRANCH}"
            fi

            echo "Building collector: << parameters.collector_name >>"
            echo "Image tag: ${CIRCLE_SHA1}"
            echo "Build arguments: ${EXTRA}"

            docker build --pull --progress=plain ${EXTRA} -t openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1} .
            docker build --pull --progress=plain -f Dockerfile_ubi9 ${EXTRA} -t openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1}-ubi9 .

  save_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Save << parameters.collector_name >>
          command: |
            mkdir -p ~/openaev/images
            docker save -o ~/openaev/images/collector-<< parameters.collector_name >> openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1}
            docker save -o ~/openaev/images/collector-<< parameters.collector_name >>-ubi9 openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1}-ubi9

  fetch_git_tags:
    steps:
      - run:
          name: Fetch Git tags
          working_directory: ~/openaev
          command: git fetch --tags --force

  set_image_tag:
    steps:
      - run:
          name: Set image tag
          working_directory: ~/openaev
          command: |
            if [ -n "${CIRCLE_TAG}" ]; then
              IMAGETAG="${CIRCLE_TAG}"
            elif [ "${CIRCLE_BRANCH}" = "main" ]; then
              IMAGETAG="rolling"
            else
              echo "Tag supplied or branch is not 'main' (was: '${CIRCLE_BRANCH}')"
              exit 1
            fi
            echo "IMAGETAG=${IMAGETAG}" >> "${BASH_ENV}"
            echo "Image tag: ${IMAGETAG}"

  set_latest_version:
    steps:
      - run:
          name: Set latest semantic version
          working_directory: ~/openaev
          command: |
            LATEST_SEMANTIC_VERSION=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

            if [ -n "${CIRCLE_TAG}" ] && [ "${CIRCLE_TAG}" = "${LATEST_SEMANTIC_VERSION}" ]; then
              IS_LATEST="true"
            else
              IS_LATEST="false"
            fi
            echo "IS_LATEST=${IS_LATEST}" >> "${BASH_ENV}"
            echo "Latest semantic version: ${LATEST_SEMANTIC_VERSION}"
            echo "IS_LATEST=${IS_LATEST}"

  load_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Load << parameters.collector_name >>
          working_directory: ~/openaev/images
          command: |
            docker image load < collector-<< parameters.collector_name >>
            docker image load < collector-<< parameters.collector_name >>-ubi9

  tag_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Tag << parameters.collector_name >>
          command: |
            if [ "<< parameters.collector_name >>" = "openaev" ]; then
              OPENBAS_COLLECTOR_NAME="openbas"
            else
              OPENBAS_COLLECTOR_NAME="<< parameters.collector_name >>"
            fi

            docker tag openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1} openaev/collector-<< parameters.collector_name >>:${IMAGETAG}
            docker tag openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1} openbas/collector-${OPENBAS_COLLECTOR_NAME}:${IMAGETAG}

            docker tag openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1}-ubi9 openaev/collector-<< parameters.collector_name >>:${IMAGETAG}-ubi9
            docker tag openaev/collector-<< parameters.collector_name >>:${CIRCLE_SHA1}-ubi9 openbas/collector-${OPENBAS_COLLECTOR_NAME}:${IMAGETAG}-ubi9

  tag_latest_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Tag latest << parameters.collector_name >> images
          command: |
            if [ "${IS_LATEST}" = "true" ]; then

              if [ "<< parameters.collector_name >>" = "openaev" ]; then
                OPENBAS_COLLECTOR_NAME="openbas"
              else
                OPENBAS_COLLECTOR_NAME="<< parameters.collector_name >>"
              fi

              docker tag openaev/collector-<< parameters.collector_name >>:${IMAGETAG} openaev/collector-<< parameters.collector_name >>:latest
              docker tag openaev/collector-<< parameters.collector_name >>:${IMAGETAG} openbas/collector-${OPENBAS_COLLECTOR_NAME}:latest

              docker tag openaev/collector-<< parameters.collector_name >>:${IMAGETAG}-ubi9 openaev/collector-<< parameters.collector_name >>:latest-ubi9
              docker tag openaev/collector-<< parameters.collector_name >>:${IMAGETAG}-ubi9 openbas/collector-${OPENBAS_COLLECTOR_NAME}:latest-ubi9
            fi

  docker_login:
    steps:
      - run:
          name: Login to Docker Hub
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  push_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Push << parameters.collector_name >>
          command: |
            if [ "<< parameters.collector_name >>" = "openaev" ]; then
              OPENBAS_COLLECTOR_NAME="openbas"
            else
              OPENBAS_COLLECTOR_NAME="<< parameters.collector_name >>"
            fi

            docker push openaev/collector-<< parameters.collector_name >>:${IMAGETAG}
            docker push openbas/collector-${OPENBAS_COLLECTOR_NAME}:${IMAGETAG}

            docker push openaev/collector-<< parameters.collector_name >>:${IMAGETAG}-ubi9
            docker push openbas/collector-${OPENBAS_COLLECTOR_NAME}:${IMAGETAG}-ubi9

  push_latest_image:
    parameters:
      collector_name:
        type: string
    steps:
      - run:
          name: Push latest << parameters.collector_name >> images
          command: |
            if [ "${IS_LATEST}" = "true" ]; then
              if [ "<< parameters.collector_name >>" = "openaev" ]; then
                OPENBAS_COLLECTOR_NAME="openbas"
              else
                OPENBAS_COLLECTOR_NAME="<< parameters.collector_name >>"
              fi

              docker push openaev/collector-<< parameters.collector_name >>:latest
              docker push openbas/collector-${OPENBAS_COLLECTOR_NAME}:latest

              docker push openaev/collector-<< parameters.collector_name >>:latest-ubi9
              docker push openbas/collector-${OPENBAS_COLLECTOR_NAME}:latest-ubi9
            fi

jobs:
  setup:
    executor: base_runner
    steps:
      - checkout
      - generate_circleci_config
      - continuation/continue:
          configuration_path: /tmp/generated_config.yml

  ensure_formatting:
    executor: python_check
    steps:
      - checkout
      - run:
          name: install dependencies
          command: pip install black isort --user
      - run:
          name: confirm black version
          command: black --version
      - run:
          name: run isort check
          command: isort --profile black --check .
      - run:
          name: run black check
          command: black --check .
      - notify_slack_failure

  linter:
    executor: flake8_check
    steps:
      - checkout
      - install_alpine_dependencies
      - run:
          name: flake8
          command: flake8 --ignore=E,W ~/repo
      - notify_slack_failure

  test:
    executor: python_test
    parameters:
      collector_name:
        type: string
    steps:
      - checkout
      - install_poetry
      - check_collector:
          collector_name: << parameters.collector_name >>
      - check_collector_tests:
          collector_name: << parameters.collector_name >>
      - install_collector_test_dependencies:
          collector_name: << parameters.collector_name >>
      - run_collector_tests:
          collector_name: << parameters.collector_name >>
      - notify_slack_failure

  build_docker_images:
    executor: docker_builder
    parameters:
      collector_name:
        type: string
    steps:
      - checkout
      - setup_remote_docker
      - build_image:
          collector_name: << parameters.collector_name >>
      - save_image:
          collector_name: << parameters.collector_name >>
      - persist_to_workspace:
          root: ~/openaev
          paths:
            - images
      - notify_slack_failure

  publish_docker_images:
    executor: docker_builder
    parameters:
      collector_name:
        type: string
    steps:
      - checkout
      - fetch_git_tags
      - set_image_tag
      - set_latest_version
      - setup_remote_docker
      - attach_workspace:
          at: ~/openaev
      - load_image:
          collector_name: << parameters.collector_name >>
      - tag_image:
          collector_name: << parameters.collector_name >>
      - tag_latest_image:
          collector_name: << parameters.collector_name >>
      - docker_login
      - push_image:
          collector_name: << parameters.collector_name >>
      - push_latest_image:
          collector_name: << parameters.collector_name >>
      - notify_slack_failure

  # TODO(#530): re-enable the main-oaev / main-ff-oaev / testing-oaev /
  # testing-xtm-one-oaev targets once a circleci ServiceAccount token is
  # provisioned for each namespace ($K8S_TOKEN is scoped to
  # customer-testing-oaev and $K8S_TOKEN_PRE_RELEASE is no longer valid).
  deploy_testing:
    executor: base_runner
    steps:
      - checkout
      - kubernetes/install-kubectl
      - run: kubectl --server=https://api.staging.eu-west.filigran.io --token=$K8S_TOKEN -n customer-testing-oaev rollout restart deployment -l app=openaev-colljector

  notify_rolling:
    executor: base_runner
    steps:
      - notify_slack_success

  notify:
    executor: base_runner
    steps:
      - notify_slack_success

workflows:
  setup:
    jobs:
      - setup:
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+$/