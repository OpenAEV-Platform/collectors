[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
pydantic = "^2.13.3"
pydantic-settings = "^2.14.0"
requests = "^2.33.0"
msal = "^1.37.0"
orjson = "^3.11.9"
pyoaev = "3.260731.0"

[tool.poetry.dependencies.python-slugify]
extras = [
    "unidecode",
]
version = "^8.0.4"

[tool.poetry.extras]
prod = []
dev = []

[tool.poetry.group.dev.dependencies]
black = "^26.3.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^1.17.1"
pip-audit = "^2.9.0"
pre-commit = "^4.6.0"
ruff = "^0.14.13"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
polyfactory = "^2.22.2"

[tool.pytest.ini_options]
testpaths = [
    "./tests",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "I001",
    "D203",
    "E501",
    "F821",
    "D205",
    "D213",
    "D211",
    "G004",
    "TRY003",
    "D104",
    "D407",
    "D408",
    "D409",
]
select = [
    "E",
    "F",
    "W",
    "D",
    "G",
    "T",
    "B",
    "C",
    "N",
    "I",
    "S",
]

[tool.mypy]
strict = true
exclude = [
    "^tests",
    "^docs",
    "^build",
    "^dist",
    "^venv",
    "^site-packages",
    "^__pypackages__",
    "^.venv",
]
plugins = [
    "pydantic.mypy",
]

[tool.cmw]
install-command = "poetry install"
config-dump-command = "poetry run python -m src --dump-config-schema"
icon-path = "src/img/microsoft-defender-o365-logo.png"

[project]
name = "microsoft-defender-o365-collector"
version = "3.260805.0"
description = "Collector for Microsoft Defender for Office 365 (email-focused alerts) for OAEV."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dynamic = [
    "dependencies",
]
Homepage = "https://filigran.io/"

[project.scripts]
MicrosoftDefenderO365Collector = "src.__main__:main"
