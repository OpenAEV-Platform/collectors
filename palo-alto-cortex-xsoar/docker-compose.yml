services:
  collector-palo-alto-cortex-xsoar:
    image: openaev/collector-palo-alto-cortex-xsoar:rolling
    # Every setting comes from .env (copy src/.env.sample next to this file).
    # Settings missing from .env stay unset, so the collector applies its own
    # defaults.
    env_file:
      - .env
    restart: always
