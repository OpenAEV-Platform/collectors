[project]
name = "collectors-sdk"
version = "0.1.0"
description = "OpenAEV Collectors SDK (DDD + Light Hex Architecture): collector daemon runtime and detection helpers."
authors = [
    {name = "Filigran", email = "contact@filigran.io"}
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pydantic (>=2.13.3,<2.14.0)",
    "thefuzz (>=0.22,<0.23)",
    "xtm-oaev-sdk (>=0.1.0,<0.2.0)",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collectors_sdk*"]

[tool.setuptools.package-data]
collectors_sdk = ["py.typed"]
