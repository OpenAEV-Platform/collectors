name: Tests Collectors

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-test-files:
    name: Detect test files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tests: ${{ steps.set-matrix.outputs.has_tests }}
      runtime_matrix: ${{ steps.set-matrix.outputs.runtime_matrix }}
      has_shipped: ${{ steps.set-matrix.outputs.has_shipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test the matrix builder
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - id: set-matrix
        name: Build test matrix
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF: main
        run: python .github/scripts/build_test_matrix.py

  test:
    name: Test ${{ matrix.name }}
    needs: detect-test-files
    if: needs.detect-test-files.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-test-files.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Clone pyoaev (satisfies Poetry path dependency)
        working-directory: ..
        run: git clone -b main https://github.com/OpenAEV-Platform/client-python

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Run tests via run_test.sh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF: main
        run: bash run_test.sh ${{ matrix.collector }}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles(format('{0}/coverage.xml', matrix.collector)) != '' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          root_dir: ${{ github.workspace }}
          fail_ci_if_error: false
          flags: ${{ matrix.collector }}
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles(format('{0}/junit.xml', matrix.collector)) != '' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results

  # The test job above force-installs pyoaev from git main, so it never exercises the pyoaev
  # release the image actually ships (the PyPI pin in pyproject.toml). This job installs exactly
  # what the Dockerfile installs, on every Python version the collector's Dockerfiles ship
  # (python:X.Y base image of Dockerfile, pythonX.Y package of Dockerfile_ubi9 - one matrix
  # entry per version, resolved by build_test_matrix.py), and boots the pieces that die first
  # when the two drift: every image from 3.260917.0 to 3.260921.0 crashed at start-up on Python
  # 3.14 with a pyoaev pinned before its 3.14 fix. The release builds' PYOAEV_GIT_REF_OVERRIDE
  # is not exercised here on purpose: it was a silent no-op on every one of those releases, and
  # the pin is what runs whenever that override is absent or fails.
  smoke-pinned-runtime:
    name: Pinned runtime ${{ matrix.name }}
    needs: detect-test-files
    if: needs.detect-test-files.outputs.has_shipped == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-test-files.outputs.runtime_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the image Python version was detected
        if: matrix.python == ''
        run: |
          echo "No Python version found in ${{ matrix.collector }}/Dockerfile or Dockerfile_ubi9 (expected 'FROM python:X.Y' or an install of 'pythonX.Y'): fix the Dockerfile or .github/scripts/build_test_matrix.py" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install the pinned runtime dependencies (same command as the Dockerfile)
        working-directory: ${{ matrix.collector }}
        run: poetry install --only main --no-root

      - name: Smoke-test the pinned pyoaev on the image interpreter
        working-directory: ${{ matrix.collector }}
        run: poetry run python ../.github/scripts/smoke_pinned_runtime.py .