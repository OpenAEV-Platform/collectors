[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"

[project]
name = "openaev-mitre-atlas-collector"
version = "3.260805.0"
description = "A Collector for fetching MITRE ATLAS taxonomies; https://atlas.mitre.org/"
readme = "README.md"
authors = [
    { name = "Filigran", email = "contact@filigran.io" },
]
requires-python = ">=3.14,<4.0"
dynamic = [
    "dependencies",
]

[project.urls]
Homepage = "https://filigran.io/"
Repository = "https://github.com/OpenAEV-Platform/collectors/tree/main/mitre-atlas"
Documentation = "https://github.com/OpenAEV-Platform/collectors/blob/main/mitre-atlas/README.md"
Issues = "https://github.com/OpenAEV-Platform/collectors/issues"

[tool.poetry.dependencies]
pydantic = ">=2.13,<3"
pydantic-settings = ">=2.14,<3"
requests = ">=2.33,<3"
pyoaev = "3.260805.0"
python-slugify = { version = ">=8.0.4,<9", extras = ["unidecode"] }

[tool.poetry]
packages = [
    { include = "mitre_atlas" },
]

[project.scripts]
MitreAtlasCollector = "mitre_atlas.__main__:main"

[tool.poetry.group.dev.dependencies]
black = "^26.3.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^1.17.1"
pip-audit = "^2.9.0"
pre-commit = "^4.6.0"
ruff = "^0.14.13"

#[tool.poetry.group.test.dependencies]
#pytest = "^9.0.0"

#[tool.pytest.ini_options]
#testpaths = [
#    "./tests",
#]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
target-version = "py314"

[tool.ruff.lint]
ignore = [
    "I001",
    "D203",
    "E501",
    "F821",
    "D205",
    "D213",
    "D211",
    "G004",
    "TRY003",
    "D104",
    "D407",
    "D408",
    "D409",
]
select = [
    "E",
    "F",
    "W",
    "D",
    "G",
    "T",
    "B",
    "C",
    "N",
    "I",
    "S",
]

[tool.mypy]
strict = true
exclude = [
    "^tests",
    "^docs",
    "^build",
    "^dist",
    "^venv",
    "^site-packages",
    "^__pypackages__",
    "^.venv",
]
plugins = [
    "pydantic.mypy",
]

[tool.cmw]
install-command = "poetry install"
config-dump-command = "poetry run python -m mitre_atlas --dump-config-schema"
icon-path = "mitre_atlas/img/icon-mitre_atlas.png"