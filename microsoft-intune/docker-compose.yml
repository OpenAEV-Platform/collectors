version: '3'
services:
  collector-microsoft-intune:
    image: openaev/collector-microsoft-intune:latest
    environment:
      - OPENAEV_URL=${OPENAEV_URL}
      - OPENAEV_TOKEN=${OPENAEV_TOKEN}
      # only required for multi-tenancy (Enterprise Edition), keep commented otherwise
      # - OPENAEV_TENANT_ID=${OPENAEV_TENANT_ID}
      - COLLECTOR_ID=${COLLECTOR_ID}
      - COLLECTOR_NAME=${COLLECTOR_NAME}
      - COLLECTOR_PERIOD=${COLLECTOR_PERIOD}
      - COLLECTOR_LOG_LEVEL=${COLLECTOR_LOG_LEVEL}
      - COLLECTOR_MICROSOFT_INTUNE_TENANT_ID=${MICROSOFT_INTUNE_TENANT_ID}
      - COLLECTOR_MICROSOFT_INTUNE_CLIENT_ID=${MICROSOFT_INTUNE_CLIENT_ID}
      - COLLECTOR_MICROSOFT_INTUNE_USE_CERTIFICATE_AUTH=${MICROSOFT_INTUNE_USE_CERTIFICATE_AUTH:-false}
      - COLLECTOR_MICROSOFT_INTUNE_CLIENT_SECRET=${MICROSOFT_INTUNE_CLIENT_SECRET}
      - COLLECTOR_MICROSOFT_INTUNE_CLIENT_CERT_DATA=${MICROSOFT_INTUNE_CLIENT_CERT_DATA:-}
      - COLLECTOR_MICROSOFT_INTUNE_CLIENT_CERT_THUMBPRINT=${MICROSOFT_INTUNE_CLIENT_CERT_THUMBPRINT:-}
      - COLLECTOR_MICROSOFT_INTUNE_CLIENT_CERT_PASSPHRASE=${MICROSOFT_INTUNE_CLIENT_CERT_PASSPHRASE:-}
      - COLLECTOR_MICROSOFT_INTUNE_DEVICE_FILTER=${MICROSOFT_INTUNE_DEVICE_FILTER}
      - COLLECTOR_MICROSOFT_INTUNE_DEVICE_GROUPS=${MICROSOFT_INTUNE_DEVICE_GROUPS}
    restart: always
