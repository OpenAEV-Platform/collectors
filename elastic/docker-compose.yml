version: "3"
services:
  collector-elastic:
    image: openaev/collector-elastic:rolling
    environment:
      - OPENAEV_URL=http://localhost
      - OPENAEV_TOKEN=ChangeMe
      # only required for multi-tenancy (Enterprise Edition), keep commented otherwise
      # - OPENAEV_TENANT_ID=ChangeMe
      - COLLECTOR_ID=ChangeMe
      - ELASTIC_BASE_URL=https://change.me
      # Authentication: provide ELASTIC_API_KEY (preferred) or username/password
      # - ELASTIC_API_KEY=ChangeMe
      - ELASTIC_USERNAME=ChangeMe
      - ELASTIC_PASSWORD=ChangeMe
      - ELASTIC_ALERTS_INDEX=.alerts-security.alerts-*
      # Optional editable Lucene query_string (unset = built-in default).
      # - ELASTIC_QUERY_TEMPLATE=
      # Raw endpoint/process events index for the implant-marker drilldown
      # (empty = disable drilldown, IP + time correlation only).
      # - ELASTIC_EVENTS_INDEX=logs-windows.sysmon_operational-*,logs-endpoint.events.process-*
    restart: always
