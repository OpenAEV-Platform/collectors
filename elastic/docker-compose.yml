services:
  collector-elastic:
    image: openaev/collector-elastic:rolling
    # Every setting comes from .env (copy src/.env.sample next to this file).
    # Settings missing from .env stay unset, so the collector applies its own
    # defaults; an explicitly empty value has a meaning for some of them
    # (e.g. ELASTIC_EVENTS_INDEX= disables the implant-marker drilldown).
    env_file:
      - .env
    # Uncomment to trust a private CA (e.g. elasticsearch-certutil) and set
    # ELASTIC_CA_CERT=/certs/ca.pem in .env.
    # volumes:
    #   - ./certs:/certs:ro
    restart: always
