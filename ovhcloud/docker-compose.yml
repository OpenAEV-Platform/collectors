version: '3'
services:
  collector-ovhcloud:
    image: openaev/collector-ovhcloud:latest
    environment:
      - OPENAEV_URL=${OPENAEV_URL}
      - OPENAEV_TOKEN=${OPENAEV_TOKEN}
      # only required for multi-tenancy (Enterprise Edition), keep commented otherwise
      # - OPENAEV_TENANT_ID=${OPENAEV_TENANT_ID}
      - COLLECTOR_ID=${COLLECTOR_ID}
      - COLLECTOR_NAME=${COLLECTOR_NAME:-OVHcloud}
      - COLLECTOR_PERIOD=${COLLECTOR_PERIOD:-PT1H}
      - COLLECTOR_LOG_LEVEL=${COLLECTOR_LOG_LEVEL:-error}
      - COLLECTOR_OVHCLOUD_ENDPOINT=${COLLECTOR_OVHCLOUD_ENDPOINT:-ovh-eu}
      - COLLECTOR_OVHCLOUD_APPLICATION_KEY=${COLLECTOR_OVHCLOUD_APPLICATION_KEY}
      - COLLECTOR_OVHCLOUD_APPLICATION_SECRET=${COLLECTOR_OVHCLOUD_APPLICATION_SECRET}
      - COLLECTOR_OVHCLOUD_CONSUMER_KEY=${COLLECTOR_OVHCLOUD_CONSUMER_KEY}
      # OAuth2 service account, instead of the three keys above
      # - COLLECTOR_OVHCLOUD_CLIENT_ID=${COLLECTOR_OVHCLOUD_CLIENT_ID}
      # - COLLECTOR_OVHCLOUD_CLIENT_SECRET=${COLLECTOR_OVHCLOUD_CLIENT_SECRET}
      - COLLECTOR_OVHCLOUD_COLLECT_DEDICATED_SERVERS=${COLLECTOR_OVHCLOUD_COLLECT_DEDICATED_SERVERS:-true}
      - COLLECTOR_OVHCLOUD_COLLECT_PUBLIC_CLOUD=${COLLECTOR_OVHCLOUD_COLLECT_PUBLIC_CLOUD:-false}
      - COLLECTOR_OVHCLOUD_COLLECT_VPS=${COLLECTOR_OVHCLOUD_COLLECT_VPS:-false}
      - COLLECTOR_OVHCLOUD_COLLECT_HOSTED_PRIVATE_CLOUD=${COLLECTOR_OVHCLOUD_COLLECT_HOSTED_PRIVATE_CLOUD:-false}
      - COLLECTOR_OVHCLOUD_SKIP_INACTIVE=${COLLECTOR_OVHCLOUD_SKIP_INACTIVE:-true}
      - COLLECTOR_OVHCLOUD_INCLUDE_PUBLIC_IPV4=${COLLECTOR_OVHCLOUD_INCLUDE_PUBLIC_IPV4:-true}
      - COLLECTOR_OVHCLOUD_INCLUDE_PUBLIC_IPV6=${COLLECTOR_OVHCLOUD_INCLUDE_PUBLIC_IPV6:-true}
      - COLLECTOR_OVHCLOUD_INCLUDE_PRIVATE_IPS=${COLLECTOR_OVHCLOUD_INCLUDE_PRIVATE_IPS:-true}
      - COLLECTOR_OVHCLOUD_IMPORT_TAGS=${COLLECTOR_OVHCLOUD_IMPORT_TAGS:-true}
      # Optional filters
      # - COLLECTOR_OVHCLOUD_PUBLIC_CLOUD_PROJECT_IDS=${COLLECTOR_OVHCLOUD_PUBLIC_CLOUD_PROJECT_IDS}
      # - COLLECTOR_OVHCLOUD_REGIONS=${COLLECTOR_OVHCLOUD_REGIONS}
      # - COLLECTOR_OVHCLOUD_NAME_INCLUDE=${COLLECTOR_OVHCLOUD_NAME_INCLUDE}
      # - COLLECTOR_OVHCLOUD_NAME_EXCLUDE=${COLLECTOR_OVHCLOUD_NAME_EXCLUDE}
      # - COLLECTOR_OVHCLOUD_IAM_TAGS=${COLLECTOR_OVHCLOUD_IAM_TAGS}
    restart: always
