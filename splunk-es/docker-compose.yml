services:
  collector-splunkes:
    image: openaev/collector-splunk-es:rolling
    # Variables listed without a value are read from .env (copy src/.env.sample
    # next to this file) or from the shell. Those set in neither stay unset, so
    # the collector applies its own defaults. To set one here instead, write
    # VAR=value; it takes precedence over .env.
    environment:
      - OPENAEV_URL
      - OPENAEV_TOKEN
      - OPENAEV_TENANT_ID
      - COLLECTOR_ID
      - COLLECTOR_NAME
      - COLLECTOR_PLATFORM
      - COLLECTOR_PERIOD
      - COLLECTOR_LOG_LEVEL
      - SPLUNK_ES_BASE_URL
      - SPLUNK_ES_USERNAME
      - SPLUNK_ES_PASSWORD
      - SPLUNK_ES_ALERTS_INDEX
      - SPLUNK_ES_TIME_WINDOW
      - SPLUNK_ES_MAX_RETRY
      - SPLUNK_ES_OFFSET
      - SPLUNK_ES_RETRY_WINDOW
      - SPLUNK_ES_QUERY_TEMPLATE
      - SPLUNK_ES_LOGGING_ENABLED
      - SPLUNK_ES_LOGGING_INDEXES
      - SPLUNK_ES_LOGGING_QUERY_TEMPLATE
      - SPLUNK_ES_LOGGING_MAX_INTERVAL
    restart: always
