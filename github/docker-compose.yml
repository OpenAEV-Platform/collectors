version: '3'
services:
  collector-github:
    image: openaev/collector-github:latest
    environment:
      - OPENAEV_URL=${OPENAEV_URL}
      - OPENAEV_TOKEN=${OPENAEV_TOKEN}
      # only required for multi-tenancy (Enterprise Edition), keep commented otherwise
      # - OPENAEV_TENANT_ID=${OPENAEV_TENANT_ID}
      - COLLECTOR_ID=${COLLECTOR_ID}
      - COLLECTOR_NAME=${COLLECTOR_NAME:-GitHub}
      - COLLECTOR_PERIOD=${COLLECTOR_PERIOD:-PT6H}
      - COLLECTOR_LOG_LEVEL=${COLLECTOR_LOG_LEVEL:-error}
      - COLLECTOR_GITHUB_TOKEN=${COLLECTOR_GITHUB_TOKEN}
      - COLLECTOR_GITHUB_API_URL=${COLLECTOR_GITHUB_API_URL:-https://api.github.com}
      - COLLECTOR_GITHUB_ORGANIZATIONS=${COLLECTOR_GITHUB_ORGANIZATIONS}
      # - COLLECTOR_GITHUB_USERS=${COLLECTOR_GITHUB_USERS}
      - COLLECTOR_GITHUB_INCLUDE_ARCHIVED=${COLLECTOR_GITHUB_INCLUDE_ARCHIVED:-true}
      - COLLECTOR_GITHUB_INCLUDE_FORKS=${COLLECTOR_GITHUB_INCLUDE_FORKS:-false}
      - COLLECTOR_GITHUB_COLLECT_WORKFLOWS=${COLLECTOR_GITHUB_COLLECT_WORKFLOWS:-true}
      - COLLECTOR_GITHUB_COLLECT_DYNAMIC_WORKFLOWS=${COLLECTOR_GITHUB_COLLECT_DYNAMIC_WORKFLOWS:-false}
      - COLLECTOR_GITHUB_COLLECT_PACKAGES=${COLLECTOR_GITHUB_COLLECT_PACKAGES:-true}
      - COLLECTOR_GITHUB_PACKAGE_TYPES=${COLLECTOR_GITHUB_PACKAGE_TYPES:-npm,maven,rubygems,nuget,container}
      - COLLECTOR_GITHUB_END_DATE_REMOVED=${COLLECTOR_GITHUB_END_DATE_REMOVED:-true}
      - COLLECTOR_GITHUB_REMOVED_ACTION=${COLLECTOR_GITHUB_REMOVED_ACTION:-end_date}
    restart: always
