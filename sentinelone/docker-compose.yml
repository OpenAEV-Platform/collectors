services:
  collector-sentinelone:
    image: openaev/collector-sentinelone:rolling
    # Variables listed without a value are read from .env (copy src/.env.sample
    # next to this file) or from the shell. Those set in neither stay unset, so
    # the collector applies its own defaults. To set one here instead, write
    # VAR=value; it takes precedence over .env.
    environment:
      - OPENAEV_URL
      - OPENAEV_TOKEN
      - OPENAEV_TENANT_ID
      - COLLECTOR_ID
      - COLLECTOR_NAME
      - COLLECTOR_PLATFORM
      - COLLECTOR_PERIOD
      - COLLECTOR_LOG_LEVEL
      - SENTINELONE_BASE_URL
      - SENTINELONE_API_KEY
      - SENTINELONE_TIME_WINDOW
      - SENTINELONE_EXPECTATION_BATCH_SIZE
      - SENTINELONE_ENABLE_DEEP_VISIBILITY_SEARCH
      - SENTINELONE_DISABLE_STRICT_END_DATE
    restart: always
